<script>
window.addEventListener("load", () => {

  const floatingBtn = document.getElementById("panel-toggle");
  const sidebarBtn  = document.getElementById("sidebar-trigger");

  if (!floatingBtn || !sidebarBtn) return;

  floatingBtn.addEventListener("click", () => {
    if (typeof sidebarBtn.onclick === "function") {
      sidebarBtn.onclick();
    }
  });

  function updateButton() {

    if (window.innerWidth >= 850) {
      floatingBtn.classList.remove("show");
      return;
    }

    const sidebarOpen = document.body.hasAttribute("sidebar-display");

    const rect = sidebarBtn.getBoundingClientRect();

    const triggerVisible =
      rect.bottom > 0 &&
      rect.top < window.innerHeight &&
      rect.left < window.innerWidth &&
      rect.right > 0;

    if (!sidebarOpen && !triggerVisible) {
      floatingBtn.classList.add("show");
    } else {
      floatingBtn.classList.remove("show");
    }
  }

  /*
   * Swipe gesture support
   *
   * Swipe right  = open panel
   * Swipe left   = close panel
   */
  let touchStartX = 0;
  let touchStartY = 0;

  const SWIPE_DISTANCE = 60;
  const SWIPE_RATIO = 1.5;

  document.addEventListener("touchstart", (event) => {

    // Only handle a single finger
    if (event.touches.length !== 1) return;

    touchStartX = event.touches[0].clientX;
    touchStartY = event.touches[0].clientY;

  }, { passive: true });


  document.addEventListener("touchend", (event) => {

    if (event.changedTouches.length !== 1) return;

    const touchEndX = event.changedTouches[0].clientX;
    const touchEndY = event.changedTouches[0].clientY;

    const deltaX = touchEndX - touchStartX;
    const deltaY = touchEndY - touchStartY;

    /*
     * Ignore short movements
     */
    if (Math.abs(deltaX) < SWIPE_DISTANCE) return;

    /*
     * Ignore mostly vertical movements
     * This prevents normal scrolling from opening/closing the panel.
     */
    if (Math.abs(deltaX) < Math.abs(deltaY) * SWIPE_RATIO) return;

    /*
     * Only enable swiping on mobile/tablet.
     */
    if (window.innerWidth >= 850) return;

    const sidebarOpen =
      document.body.hasAttribute("sidebar-display");

    /*
     * Swipe RIGHT -> open sidebar
     */
    if (deltaX > 0 && !sidebarOpen) {

      if (typeof sidebarBtn.onclick === "function") {
        sidebarBtn.onclick();
      }

    }

    /*
     * Swipe LEFT -> close sidebar
     */
    else if (deltaX < 0 && sidebarOpen) {

      if (typeof sidebarBtn.onclick === "function") {
        sidebarBtn.onclick();
      }

    }

  }, { passive: true });

  updateButton();

  window.addEventListener("scroll", updateButton, { passive: true });
  window.addEventListener("resize", updateButton);

  new MutationObserver(updateButton).observe(document.body, {
    attributes: true,
    attributeFilter: ["sidebar-display"]
  });

});
</script>
